; Sound-reactive light rocks: two NeoPixel strips driven by the M5StickS3
; (G9 / G10 on the Grove connector) or M5StickC Plus2 (G32 / G33).
;
;   pio run                                          build M5StickS3 (default)
;   pio run -t upload                                flash M5StickS3
;   pio device monitor                               serial output
;
;   pio run -e m5stick-c-plus2                       build M5StickC Plus2
;   pio run -e m5stick-c-plus2 -t upload             flash M5StickC Plus2
;
; See README.md for wiring and the web UI, docs/SPEC.md for behaviour.

[platformio]
default_envs = m5sticks3

[env:m5sticks3]
platform = espressif32@6.12.0
board = m5sticks3
framework = arduino
board_build.partitions = default_8MB.csv
upload_speed = 1500000
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

lib_deps =
    m5stack/M5Unified@^0.2.27
    adafruit/Adafruit NeoPixel@^1.12.3

build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DFFT_BACKEND_ESP_DSP
    -DSTRIP1_PIN=9
    -DSTRIP2_PIN=10
    -DWIFI_SSID=\"LightRocks-1\"
    -DWIFI_PASSWORD=\"lightrocks\"

[env:m5stick-c-plus2]
platform = espressif32@6.12.0
board = m5stick-c-plus2
framework = arduino
board_build.partitions = default_8MB.csv
upload_speed = 1500000
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

lib_deps =
    m5stack/M5Unified@^0.2.27
    adafruit/Adafruit NeoPixel@^1.12.3

; M5Unified needs C++17. The FFT backend is chosen at compile time.
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DFFT_BACKEND_ESP_DSP
    -DSTRIP1_PIN=32
    -DSTRIP2_PIN=33
    -DWIFI_SSID=\"LightRocks-3\"
    -DWIFI_PASSWORD=\"lightrocks\"

; Alternative FFT backend: arduinoFFT instead of ESP-DSP. Same firmware, same
; behaviour; the ESP-DSP one is faster and needs no extra dependency.
;
; NOTE arduinoFFT is GPL-3.0, so a binary built from this environment is GPL-3.0.
; The default environment above contains only Apache-2.0 and MIT code.
[env:m5stick-c-plus2-arduinodft]
extends = env:m5stick-c-plus2
build_flags =
    -std=gnu++17
    -DFFT_BACKEND_ARDUINO_FFT
lib_deps =
    ${env:m5stick-c-plus2.lib_deps}
    kosme/arduinoFFT@^2.0.4
